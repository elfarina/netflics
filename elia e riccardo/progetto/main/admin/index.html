<body>
    <div class="wrapper">
        <header>
            <nav class="mynavbar">
                <div class="navbar-title">
                    <span class="navbar-logo">
                        <img src="../images/logo.svg">
                    </span>
                    <span class="navbar-text title italic netflix-font netflix-color">
                        Admin Control Page
                    </span>
                </div>
                <div class="navbar-buttons">
                    <div class="nav-button-list">
                        <a href="#" class="navbar-button">
                            <i class="fa fa-user-circle"></i>

                        <a href="#" class="navbar-button">

                        <a href="#" class="navbar-button">
                            <i class="fa fa-eye"></i>
                        </a>

                </div>
            </nav>
        </header>
        <section class="main">
            <div class="datasheet-container">
                <div class="content-table-title big-title netflix-font netflix-color italic">
                    Lista dei contenuti
                </div>
                <div class="content-wrapper">
                    <div class="content-table">
                        <!-- ajax result -->
                    </div>
                </div>
            </div>
            <div class="movie-form">
                <div class="form-title big-title netflix-font italic netflix-color">
                    Carica un film
                </div>
                <form action="upload-movie.php" id="uploadForm" method="post" enctype="multipart/form-data">
                    <div class="input-wrapper">
                        <label for="title" class="input-title">Titolo</label>
                        <input type="text" name="title" id="content-title" required>
                    </div>
                    <div class="input-wrapper">
                        <label for="description" class="input-title">Descrizione</label>
                        <textarea name="description" id="content-description"></textarea>
                    </div>
                    <div class="input-wrapper">
                        <label for="release_year" class="input-title">Anno</label>
                        <input type="number" name="release_year" id="content-release_year" min="1900" max="2100">
                    </div>
                    <div class="input-wrapper">
                        <label for="rating" class="input-title">Voto</label>
                        <input type="number" name="rating" id="content-rating" min="1" max="10" step="0.1">
                    </div>

                    <div class="input-wrapper">
                        <label for="content-poster" class="file-label">Poster</label>
                        <input type="file" name="poster-file" id="content-poster" accept="image/jpeg" required>
                        <span class="poster-name">Nessun file selezionato</span>
                    </div>
                    <div class="input-wrapper">
                        <label for="content-movie" class="file-label">Video</label>
                        <input type="file" name="movie-file" id="content-movie" accept="video/*" required>
                        <span class="movie-name">Nessun file selezionato</span>
                    </div>
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar">0%</div>
                    </div>
                    <p id="uploadStatus"></p>
                    <p id="uploadStatus"></p>
                    <div id="errorMessages" style="color: red; font-weight: bold; display: none;">
                        <!-- Gli errori verranno visualizzati qui -->
                    </div>
                    <input type="submit" value="invia">
                </form>
            </div>
        </section>
    </div>
    <footer>
    </footer>
</body>
<script src="script.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        // Funzione per caricare la lista dei contenuti
        function loadContent() {
            $.ajax({
                url: 'get-content.php', // URL del file PHP che restituirà i contenuti
                method: 'GET',
                dataType: 'json',
                success: function (response) {
                    if (response.status === 'success') {
                        let contentTable = $('.content-table');
                        contentTable.empty(); // Pulisce la tabella esistente
                        // Creiamo la tabella per visualizzare i contenuti
                        let tableHTML = '<table class="table table-striped">';
                        tableHTML += '<thead class="netflix-font italic subtitle"><tr><th>Titolo</th><th>Descrizione</th><th>Anno</th><th>Voto</th><th>Azioni</th></tr></thead>';
                        tableHTML += '<tbody>';
                        // Loop attraverso i contenuti e crea le righe della tabella
                        $.each(response.data, function (index, content) {
                            tableHTML += '<tr>';
                            tableHTML += `<td class="netflix-font subtitle italic">${content.title}</td>`;
                            tableHTML += `<td>${content.description}</td>`;
                            tableHTML += `<td>${content.release_year}</td>`;
                            tableHTML += `<td>${content.rating}</td>`;
                            tableHTML += `<td class="netflix-font"><button class="btn btn-danger delete-content " data-id="${content.id}">Elimina</button></td>`;
                            tableHTML += '</tr>';
                        });

                        tableHTML += '</tbody></table>';
                        contentTable.html(tableHTML); // Inserisce la tabella nel DOM

                        // Aggiungi un gestore di eventi per il pulsante di eliminazione
                        $('.delete-content').on('click', function () {
                            let contentId = $(this).data('id');
                            deleteContent(contentId);
                        });
                    } else {
                        $('#errorMessages').show().text(response.message);
                    }
                },
                error: function () {
                    $('#errorMessages').show().text('Si è verificato un errore durante il recupero dei contenuti.');
                }
            });
        }
        // Funzione per eliminare un contenuto
        function deleteContent(contentId) {
            if (confirm('Sei sicuro di voler eliminare questo contenuto?')) {
                $.ajax({
                    url: 'delete-content.php', // URL del file PHP che gestisce l'eliminazione
                    method: 'POST',
                    data: { id: contentId },
                    success: function (response) {
                        if (response.status === 'success') {
                            loadContent(); // Ricarica i contenuti dopo l'eliminazione
                        } else {
                            $('#errorMessages').show().text(response.message);
                        }
                    },
                    error: function () {
                        $('#errorMessages').show().text('Si è verificato un errore durante l\'eliminazione del contenuto.');
                    }
                });
            }
        }

        // Carica i contenuti quando la pagina è pronta
        loadContent();
    });
</script>

</html>
