    <script>
        // Funzione per ottenere i parametri dalla query string
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Mostra l'alert con gli errori al caricamento della pagina
        window.onload = function () {
            const errors = getQueryParam('errors');
            if (errors) {
                alert(errors.replace(/\n/g, '\n')); // Sostituisci '\n' con una nuova riga
            }
        };
    </script>
